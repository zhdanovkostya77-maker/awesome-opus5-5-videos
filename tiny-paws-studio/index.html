<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Paws — Bunny's First Adventure</title>
<style>html,body{margin:0;background:#121827;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100%}main{text-align:center}canvas{width:min(90vw,360px);aspect-ratio:9/16;border-radius:16px;box-shadow:0 15px 50px #0007}button{padding:12px 18px;margin:10px;border:0;border-radius:10px;background:#f9ce69;font-weight:700}</style></head>
<body><main><h2>Tiny Paws — Episode 1</h2><canvas id="scene" width="540" height="960"></canvas><div><button id="play">Play / Restart</button><button id="record">Record WebM</button></div><p>20-second original animated scene · 9:16 · no external assets</p></main>
<script>
const c=document.getElementById('scene'),ctx=c.getContext('2d');let start=performance.now(),active=true,recorder;
function ellipse(x,y,rx,ry,color,rotation=0){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function flower(x,y,s,h){ctx.strokeStyle='#31754a';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+60*s);ctx.stroke();for(let i=0;i<6;i++){let a=i*Math.PI/3;ellipse(x+Math.cos(a)*15*s,y+Math.sin(a)*15*s,12*s,9*s,h,a)}ellipse(x,y,9*s,9*s,'#ffdf63')}
function frame(now){const t=active?Math.min((now-start)/1000,20):0;let sky=ctx.createLinearGradient(0,0,0,960);sky.addColorStop(0,'#7dd8ff');sky.addColorStop(.65,'#d3f9c2');sky.addColorStop(1,'#6fc16e');ctx.fillStyle=sky;ctx.fillRect(0,0,540,960);ellipse(450,145,65,65,'#fff3ad');for(let i=0;i<8;i++)ellipse(i*90-40,710+Math.sin(i)*22,95,125,i%2?'#62b96b':'#79cb70');for(let i=0;i<34;i++){let x=(i*137)%540,y=710+(i*71)%240;flower(x,y,.45+(i%4)*.13,['#ff80b5','#ffcf64','#a6a0ff','#fff'][i%4])}
let bob=Math.sin(t*5)*7,hop=t>8&&t<12?Math.abs(Math.sin(t*4))*65:0;ctx.save();ctx.translate(270,590+bob-hop);ellipse(0,165,100,130,'#e9e6ee');ellipse(-56,260,55,35,'#f7f3fa');ellipse(56,260,55,35,'#f7f3fa');ellipse(-68,-145,40,165,'#f1edf4',-.23+Math.sin(t*2)*.05);ellipse(68,-145,40,165,'#f1edf4',.23-Math.sin(t*2)*.05);ellipse(-68,-145,20,125,'#f8a7bd',-.23);ellipse(68,-145,20,125,'#f8a7bd',.23);ellipse(0,-15,125,120,'#f2eef5');ellipse(-45,-18,26,34,'white');ellipse(45,-18,26,34,'white');ellipse(-40,-14,15,23,'#292c42');ellipse(40,-14,15,23,'#292c42');ellipse(-34,-22,5,7,'white');ellipse(46,-22,5,7,'white');ellipse(0,32,15,11,'#f38da7');ctx.strokeStyle='#6b5367';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,42,18,0,Math.PI);ctx.stroke();ellipse(-96,145,28,55,'#eeeaf2',-.4);ellipse(96,145,28,55,'#eeeaf2',.4);ctx.restore();ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#24472b';ctx.shadowBlur=9;ctx.font='bold 39px system-ui';ctx.fillText(t<5?'HELLO, FRIEND!':t<13?'LET\'S EXPLORE!':'FRIENDSHIP BLOOMS!',270,125);ctx.shadowBlur=0;ctx.font='26px system-ui';ctx.fillText(t<13?'A little bunny, a big adventure':'Be kind. Share a smile!',270,175);if(active&&t<20)requestAnimationFrame(frame);else active=false}
function play(){start=performance.now();active=true;requestAnimationFrame(frame)}document.getElementById('play').onclick=play;
document.getElementById('record').onclick=()=>{if(!c.captureStream||!window.MediaRecorder){alert('Recording not supported in this browser. Try desktop Chrome.');return}play();let chunks=[];let stream=c.captureStream(30);let options=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?{mimeType:'video/webm;codecs=vp9'}:{mimeType:'video/webm'};recorder=new MediaRecorder(stream,options);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));let a=document.createElement('a');a.href=url;a.download='tiny-paws-episode-1.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};recorder.start();setTimeout(()=>recorder.stop(),20000)};requestAnimationFrame(frame);
</script></body></html>
